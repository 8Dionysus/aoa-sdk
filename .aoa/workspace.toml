schema_version = 1

[layout]
federation_roots = ["{workspace_parent}"]

[roots]
external = ["~/src"]

[repos.abyss-stack]
role = "source_checkout"
preferred = ["~/src/abyss-stack"]
runtime_mirror = "{workspace_parent}/abyss-stack"
notes = "Use the git checkout for source work. The /srv path is a deployed runtime mirror."

[repos.aoa-sdk]
role = "sdk_checkout"
notes = "This repository is expected to live inside the local AoA federation workspace."

[repos.aoa-dashboard]
role = "goal-space-derived-organ"
notes = "Optional derived Goal Space/operator organ; source identity does not imply private registry admission or runtime deployment."

[control_plane]
routing_bundle_root = "{workspace_parent}/abyss-stack/Knowledge/federation/aoa-routing"

[organ_access]
registry_source = "{workspace_parent}/.aoa/organ-access/organ-registry.source.json"
