name: Release Artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable SDK release tag to rebuild
        required: false
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
  ARTIFACT_REF_NAME: ${{ inputs.release_tag || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.release_tag || github.sha }}
          fetch-depth: 0

      - name: Fetch routing succession evidence history
        run: >-
          git fetch --no-tags origin
          '+refs/tags/routing-succession-e1-evidence-20260728:refs/tags/routing-succession-e1-evidence-20260728'

      - name: Validate immutable release evidence ref
        if: env.RELEASE_TAG != ''
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release_tag must be an exact semantic-version tag" >&2
            exit 1
          fi
          git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG"

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -e '.[dev]' build

      - name: Run tests
        run: python -m pytest -q

      - name: Run Ruff
        run: python -m ruff check .

      - name: Run mypy
        run: python -m mypy src

      - name: Build package
        run: python -m build

      - name: Verify installed canonical routing producer
        run: >-
          python
          mechanics/boundary-bridge/parts/consumed-surface-posture-gate/scripts/verify_routing_g5_canonical_wheel.py

      - name: Verify installed plan compiler
        run: >-
          python
          mechanics/boundary-bridge/parts/plan-compilation-control-plane/scripts/verify_plan_compilation_wheel.py

      - name: Verify installed Runner
        run: >-
          python
          mechanics/boundary-bridge/parts/runner-lifecycle-control-plane/scripts/verify_runner_wheel.py

      - name: Verify installed evidence chain
        run: >-
          python
          mechanics/boundary-bridge/parts/evidence-closeout-chain/scripts/verify_evidence_chain_wheel.py

      - name: Checkout abyss-machine verifier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: 8Dionysus/abyss-machine
          ref: 7f1b9fcf6f5beca7203f49ffb7ec53d765d1db86
          path: .abyss-machine-verifier

      - name: Validate OS Abyss package artifact bundle
        env:
          ABYSS_MACHINE_REPO_ROOT: .abyss-machine-verifier
        run: >-
          python
          mechanics/release-support/parts/release-audit-publish-helper/scripts/validate_abyss_machine_package_artifact_bundle.py

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aoa-sdk-dist-${{ env.ARTIFACT_REF_NAME }}
          path: |
            dist/*.whl
            dist/aoa_sdk-*.tar.gz
          if-no-files-found: error
